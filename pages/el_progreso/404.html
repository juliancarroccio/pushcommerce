<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Supermercado El Progreso</title>
  <link rel="icon" href="./img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="./img/favicon-180.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1F6B3A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1F6B3A;
      color: #FAF8F2;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      overflow: hidden;
    }

    .bg-num {
      position: fixed;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: clamp(180px, 32vw, 300px);
      line-height: 1;
      color: rgba(250,248,242,0.08);
      user-select: none;
      pointer-events: none;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .content { position: relative; z-index: 1; }

    .logo {
      width: 96px; height: 96px; border-radius: 50%;
      object-fit: cover;
      background: #FAF8F2;
      padding: 10px;
      margin: 0 auto 32px;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #FAF8F2;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(250,248,242,0.75);
      margin-bottom: 40px;
    }

    .divider {
      width: 3rem; height: 3px;
      background: #4CAF6D;
      margin: 0 auto 40px;
      border-radius: 2px;
    }

    a.btn {
      display: inline-block;
      background: #FAF8F2;
      color: #1F6B3A;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    a.btn:hover { background: #4CAF6D; color: #FAF8F2; transform: scale(1.03); }

    .brand {
      margin-top: 48px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(250,248,242,0.4);
    }
  </style>
</head>
<body>
  <p class="bg-num" aria-hidden="true">404</p>

  <div class="content">
    <img src="./img/logo.png" alt="Supermercado El Progreso" class="logo">
    <h1>Página no encontrada</h1>
    <p class="subtitle">
      Este changuito se fue por otro pasillo.<br>
      Volvamos a la entrada.
    </p>
    <div class="divider"></div>
    <a href="./index.html" class="btn">← Volver al inicio</a>
    <p class="brand">Supermercado El Progreso · Las Flores, Buenos Aires</p>
  </div>
</body>
</html>
